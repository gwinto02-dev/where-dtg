name: Build Documentary

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Episode topic"
        required: true
        default: "Where Does Your Old Phone Actually Go?"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Build episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -m src.pipeline --topic "${{ inputs.topic }}"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: documentary-video
          path: |
            output/episode.mp4
            work/episode.json
            work/media_manifest.json
          retention-days: 3

      - name: Upload video for email link
        id: upload_video
        run: |
          set -e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          URL=$(curl -sS -A "$UA" -F "file=@output/episode.mp4" https://0x0.st || true)

          if [[ "$URL" != http* ]]; then
            echo "0x0.st upload failed (response: $URL), trying catbox.moe..."
            URL=$(curl -sS -A "$UA" -F "reqtype=fileupload" -F "fileToUpload=@output/episode.mp4" https://catbox.moe/user/api.php || true)
          fi

          if [[ "$URL" != http* ]]; then
            echo "Both uploads failed. Last response: $URL"
            exit 1
          fi

          echo "Video URL: $URL"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Email the video link
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.EMAIL_PORT || 465 }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ inputs.topic }}"
          to: ${{ secrets.EMAIL_TO }}
          from: Where Does It Go
          body: |
            Your documentary "${{ inputs.topic }}" is ready.

            Download it here (link, not an attachment, since the video is too large to email directly):
            ${{ steps.upload_video.outputs.video_url }}

            Note: this link is hosted on a public file-sharing service (0x0.st) and is not private/password-protected. Anyone with the link can download the file, and it will eventually expire (retention scales with file size, typically 30+ days).
