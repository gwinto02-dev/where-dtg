name: Build Documentary

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Episode topic"
        required: true
        default: "Where Does Your Old Phone Actually Go?"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Build episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python -m src.pipeline --topic "${{ inputs.topic }}"

      - name: Name video by topic
        id: name_video
        run: |
          SLUG=$(echo "${{ inputs.topic }}" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-80)
          if [ -z "$SLUG" ]; then SLUG="episode"; fi
          FILENAME="${SLUG}.mp4"
          mv "output/episode.mp4" "output/${FILENAME}"
          echo "Renamed to output/${FILENAME}"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: documentary-video
          path: |
            output/${{ steps.name_video.outputs.filename }}
            work/episode.json
            work/media_manifest.json
          retention-days: 3

      - name: Upload video to a GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_id }}
          name: "${{ inputs.topic }}"
          body: "Auto-generated documentary: ${{ inputs.topic }}"
          files: output/${{ steps.name_video.outputs.filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Email the video link
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.EMAIL_PORT || 465 }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ inputs.topic }}"
          to: ${{ secrets.EMAIL_TO }}
          from: Where Does It Go
          body: |
            Your documentary "${{ inputs.topic }}" is ready.

            File: ${{ steps.name_video.outputs.filename }}

            Download it from this GitHub Release page (click the .mp4 file under Assets):
            ${{ steps.release.outputs.url }}

            Note: if this repo is private, you'll need to be logged into GitHub to download it. If it's public, the link works for anyone.
